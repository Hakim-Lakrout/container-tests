<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Liens Utiles</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <section class="liens-utiles">
    <h2>Liens Utiles</h2>
    <ul>
      <li><a href="https://github.com/aquasecurity/trivy" target="_blank">Trivy</a></li>
      <li><a href="https://github.com/GoogleContainerTools/container-structure-test" target="_blank">Container Structure Test</a></li>
      <li><a href="https://github.com/bats-core/bats-core" target="_blank">BATS</a></li>
      <li><a href="https://github.com/aquasecurity/trivy-action" target="_blank">GitHub Action - Trivy</a></li>
      <li><a href="https://github.com/marketplace/actions/container-structure-tests" target="_blank">GitHub Action - Container Structure Test</a></li>
      <li><a href="https://github.com/marketplace/actions/setup-bats-testing-framework" target="_blank">GitHub Action - BATS</a></li>
    </ul>
  </section>

  <section class="remerciements">
    <h2>Remerciements</h2>
    <p>Merci pour votre écoute</p>

    <div class="images-wrapper">
      <div>
        <img src="/static/feedback.png" alt="Feedback" class="feedback-img">
        <p class="caption">Feedback</p>
      </div>
      <div>
        <img src="/static/ressources.png" alt="Ressources QR" class="feedback-img">
        <p class="caption">Ressources</p>
      </div>
    </div>
  </section>

  <style>
    .images-wrapper {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2rem;
      margin-top: 1.5rem;
    }

    .feedback-img {
      width: 100%;
      max-width: 250px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      transition: transform 0.3s ease;
    }

    .feedback-img:hover {
      transform: scale(1.05);
    }

    .caption {
      margin-top: 0.5rem;
      font-size: 0.95rem;
      color: #666;
      font-style: italic;
    }
  </style>
</body>
</html>
